name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the primary target: ConPTY and process-tree behavior are what the tests prove.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
